<div class="main">
    <h1 text-align="center">Software Experience</h1>
    <div *ngFor="let card of software_cards" class="card-container">
        <app-card class="card" 
        [title]="card.title" 
        [company]="card.company"
        [date]="card.date" 
        [content]="card.content"
        ></app-card>
    </div>
    <h1>Design Experience</h1>
    <div *ngFor="let card of design_cards" class="card-container">
        <app-card class="card" 
        [title]="card.title" 
        [company]="card.company"
        [date]="card.date" 
        [content]="card.content"
        ></app-card>
    </div>
</div>
