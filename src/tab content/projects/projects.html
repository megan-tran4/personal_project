<div class="main">
    <h1>Design Projects</h1>
    <div class="row">
    
    <div class="projects" *ngFor ="let project of design_projects">
        <app-project-preview
            [title]="project.title"
            [date]="project.date"
            [tools]="project.tools.join(', ')"
            [image]="project.image"> 
        </app-project-preview>
    </div>
    </div>
    
</div>
