<div class="card">
    <div class="card-body">
        <div class="board">
            <div class="tile" (click)="this.makeMove(0)">{{this.board[0]}}</div>
            <div class="tile" (click)="this.makeMove(1)">{{this.board[1]}}</div>
            <div class="tile" (click)="this.makeMove(2)">{{this.board[2]}}</div>
            <div class="tile" (click)="this.makeMove(3)">{{this.board[3]}}</div>
            <div class="tile" (click)="this.makeMove(4)">{{this.board[4]}}</div>
            <div class="tile" (click)="this.makeMove(5)">{{this.board[5]}}</div>
            <div class="tile" (click)="this.makeMove(6)">{{this.board[6]}}</div>
            <div class="tile" (click)="this.makeMove(7)">{{this.board[7]}}</div>
            <div class="tile" (click)="this.makeMove(8)">{{this.board[8]}}</div>
        </div>
        <button class="reset-button" (click)="this.resetGame()">Reset Game</button>
    </div>
</div>
