<div class="card">
    <div class="card-body" (click)="goToProject(title)">
        <img src="{{ image }}" alt="logo" class="company-logo" style="width: 100%; height: auto;"/>
        <h1 class="card-title">{{ title }}</h1>
        <h2 class="card-date">{{ date }}</h2>
        <h3> Frameworks and Tools: <span style="font-weight:normal;">{{ tools }}</span></h3>
    </div>
</div>
